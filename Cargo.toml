[package]
name = "pmon"
version = "0.1.1"
edition = "2024"
description = "Minimal terminal CPU / RAM monitor with an optional history daemon"
license = "MIT"
repository = "https://github.com/rpattn/pmon"
readme = "README.md"
keywords = ["monitor", "cpu", "memory", "tui", "top"]
categories = ["command-line-utilities"]
exclude = [".github/", "packaging/"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pmon-v{ version }-{ target }{ archive-suffix }"
bin-dir = "pmon-v{ version }-{ target }/{ bin }{ binary-ext }"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
humantime = "2.4.0"
nucleo = "0.5.0"
ratatui = "0.30.2"
sysinfo = { version = "0.40.0", default-features = false, features = ["system", "disk", "network", "gpu"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true
