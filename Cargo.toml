[package]
name = "pmon"
version = "0.1.0"
edition = "2024"
description = "Minimal terminal CPU / RAM monitor with an optional history daemon"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
humantime = "2.4.0"
libc = "0.2.191"
nucleo = "0.5.0"
ratatui = "0.30.2"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
